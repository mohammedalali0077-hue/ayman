<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0734a2" />
  <title>أفكاري | بنك الأفكار</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-page">
  <header class="home-topbar">
    <div class="home-topbar-inner">
      <div class="home-user">
        <span class="home-user-dot">●</span>
        <span id="employeeWelcome">مرحباً بك</span>
      </div>
      <div class="home-actions">
        <button class="home-submit-top" id="newIdeaBtn" type="button">+ فكرة جديدة</button>
        <button class="home-logout" id="backHomeBtn" type="button">الرئيسية</button>
        <button class="home-logout" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <section class="dashboard-head">
      <div>
        <span class="dashboard-kicker">بنك الأفكار</span>
        <h1>داش بورد أفكاري</h1>
        <p>تابع الأفكار التي أرسلتها وحالتها الحالية وملاحظات لجنة التقييم.</p>
      </div>
      <button id="downloadBtn" class="download-ideas-btn" type="button">تنزيل تقرير أفكاري</button>
    </section>

    <section class="dashboard-stats" aria-label="ملخص الأفكار">
      <article><span id="statTotal">0</span><b>إجمالي الأفكار</b></article>
      <article><span id="statReview">0</span><b>قيد الدراسة</b></article>
      <article><span id="statApproved">0</span><b>معتمدة / تنفيذ</b></article>
      <article><span id="statDone">0</span><b>منفذة</b></article>
    </section>

    <section class="dashboard-list-wrap">
      <div class="dashboard-list-title">
        <h2>أفكاري المرسلة</h2>
        <button id="refreshBtn" class="refresh-ideas-btn" type="button">تحديث</button>
      </div>
      <div id="ideasLoading" class="ideas-empty">جاري تحميل أفكارك...</div>
      <div id="myIdeasList" class="my-ideas-list"></div>
    </section>
  </main>

  <footer class="site-footer"><span>مكتبة أيمن © 2026 جميع الحقوق محفوظة</span><span>معاً .. نصنع فرقاً أفضل</span></footer>
  <script src="dashboard.js"></script>
</body>
</html>
