<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0734a2" />
  <title>تسجيل الدخول | بنك الأفكار</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-decor auth-decor-sky"></div>
  <div class="auth-decor auth-decor-pink"></div>
  <div class="auth-decor auth-decor-yellow"></div>
  <div class="auth-decor auth-decor-purple"></div>

  <main class="auth-shell">
    <section class="auth-brand-panel" aria-label="بنك الأفكار">
      <img class="auth-brand-logo" src="assets/ayman-logo.png" alt="شعار مكتبة أيمن" />
      <h1>بنك الأفكار</h1>
      <h2>معاً .. نصنع فرقاً أفضل</h2>
      <p>منصة داخلية لموظفي مكتبة أيمن لطرح الأفكار والمبادرات الإبداعية وتحويلها إلى فرص تطوير حقيقية.</p>
    </section>

    <section class="auth-card" aria-labelledby="loginTitle">
      <img class="auth-card-logo" src="assets/ayman-logo.png" alt="شعار مكتبة أيمن" />
      <h2 id="loginTitle">مرحباً بك</h2>
      <p>للدخول إلى بنك الأفكار، أدخل رقمك الوظيفي أو اسمك</p>

      <label class="sr-only" for="employeeIdentity">رقم الموظف أو الاسم</label>
      <div class="identity-input-wrap">
        <span class="identity-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><path d="M12 12a4.25 4.25 0 1 0 0-8.5 4.25 4.25 0 0 0 0 8.5Zm0 2c-4.35 0-7.75 2.22-7.75 5.05 0 .8.65 1.45 1.45 1.45h12.6c.8 0 1.45-.65 1.45-1.45C19.75 16.22 16.35 14 12 14Z"/></svg>
        </span>
        <input id="employeeIdentity" type="text" autocomplete="name" placeholder="رقم الموظف أو الاسم" autofocus />
      </div>

      <button id="continueBtn" class="primary-login-btn" type="button">
        <span>دخول</span><span class="arrow-circle" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5M8.5 12H20"/></svg></span>
      </button>
      <p id="loginError" class="error login-error" role="alert"></p>

      <div class="login-divider"><span>أو</span></div>
      <a class="network-btn" href="admin.html"><span class="committee-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 11a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5ZM8 11a3.25 3.25 0 1 0 0-6.5A3.25 3.25 0 0 0 8 11Zm8 2c-2.45 0-4.45 1.17-4.45 2.62 0 .24.06.47.16.68h7.87c.1-.21.17-.44.17-.68C19.75 14.17 18.45 13 16 13ZM8 13c-3.25 0-5.75 1.55-5.75 3.55 0 .66.54 1.2 1.2 1.2h9.1c.66 0 1.2-.54 1.2-1.2C13.75 14.55 11.25 13 8 13Z"/></svg></span><span>دخول لجنة التقييم</span></a>
      <p class="login-quote">“الأفكار الصغيرة تصنع إنجازات كبيرة”</p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
