<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لجنة التقييم - بنك الأفكار</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand"><img src="assets/ayman-logo.png" alt="Ayman Bookstore"><div><strong>بنك الأفكار</strong><small>مكتبة أيمن</small></div></div>
    <a href="index.html" class="admin-entry">واجهة الموظفين</a>
  </header>

  <main class="container wide">
    <section class="hero card compact-hero">
      <div class="hero-icon brand-mark"><img src="assets/ayman-logo.png" alt="شعار مكتبة أيمن"></div>
      <div><span class="eyebrow">لوحة لجنة التقييم</span><h1>إدارة الأفكار والمبادرات</h1><p>مراجعة الأفكار وتقييمها وفق الجدوى، سهولة التطبيق، والعائد على الاستثمار.</p></div>
    </section>

    <section id="adminLogin" class="card form-card narrow">
      <h2>دخول اللجنة</h2>
      <label>اسم المستخدم</label>
      <input id="adminUsername" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" />
      <label>كلمة المرور</label>
      <input id="adminPassword" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" />
      <button id="adminLoginBtn">دخول</button>
      <p id="adminError" class="error"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <section class="registration-panel card">
        <div class="dashboard-head">
          <div>
            <h2>طلبات تسجيل الموظفين <span id="registrationBadge" class="registration-badge hidden">0</span></h2>
            <p class="muted">وافق على الموظف قبل السماح له بالدخول إلى بنك الأفكار.</p>
          </div>
        </div>
        <div id="registrationsList" class="registrations-list"></div>
      </section>

      <div class="dashboard-head">
        <div><h2>الأفكار الواردة</h2><p id="statsText" class="muted"></p></div>
        <div class="toolbar"><button id="adminLogoutBtn" class="secondary">تسجيل الخروج</button><select id="statusFilter"><option value="">كل الحالات</option><option>جديدة</option><option>قيد التقييم</option><option>معتمدة</option><option>قيد التنفيذ</option><option>منفذة</option><option>مرفوضة</option></select><button id="refreshBtn" class="secondary">تحديث</button></div>
      </div>
      <div id="ideasList" class="ideas-grid"></div>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
